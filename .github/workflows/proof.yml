name: proof
on: [push, pull_request, workflow_dispatch]
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: the kernels, the wire end to end, the source scans, the vendored law, the value, the page
        run: npm test
      - name: no key- or token-shaped string in any tracked file (W3)
        run: node tools/scan.mjs
      - name: the pinned CUAD file, checked by hash
        run: |
          mkdir -p /tmp/cuad
          curl -sSL -o /tmp/cuad/data.zip https://github.com/TheAtticusProject/cuad/raw/main/data.zip
          echo "f8161d18bea4e9c05e78fa6dda61c19c846fb8087ea969c172753bc2f45b999a  /tmp/cuad/data.zip" | sha256sum -c -
          unzip -q -o /tmp/cuad/data.zip CUADv1.json -d /tmp/cuad
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: the pinned CORD v2 receipts, the ground_truth column only (no images), checked by hash
        run: |
          python -m pip install --quiet pyarrow==26.0.1
          mkdir -p /tmp/cord
          python -I tools/cord_fetch.py /tmp/cord/cord-v2-ground-truth.jsonl
          echo "272432829e501edde76ee9457a04c146e4e6e5d7fb40c0c395fc71a93f82c613  /tmp/cord/cord-v2-ground-truth.jsonl" | sha256sum -c -
      - name: the pinned PolyAI messages (Banking77 + NLU++, commit 57ec275), checked by their manifest hash
        run: node tools/polyai_fetch.mjs /tmp/polyai --check d014c397bfa65560859b7856a4f855fbd738f6e49c71640b7219e3ab5f9549e5
      - name: the pinned CLINC150 files (commit 828f809, CC BY 3.0), each checked by its sha256 (seal 8)
        run: node tools/clinc_fetch.mjs /tmp/clinc150
      - name: the pinned MAUD file (The Atticus Project, commit 4640316, CC BY 4.0), checked by hash, its three CSVs unzipped (seal 9)
        run: |
          mkdir -p /tmp/maud
          curl -sSL -o /tmp/maud/data.zip https://raw.githubusercontent.com/TheAtticusProject/maud/4640316078dcd370debb877f350c39a28b181ffe/data.zip
          echo "75af5a33d038e9254864f043da38072490ffe11e8488d58d0a2dd39c8f554519  /tmp/maud/data.zip" | sha256sum -c -
          unzip -q -o /tmp/maud/data.zip data/MAUD_train.csv data/MAUD_dev.csv data/MAUD_test.csv -d /tmp/maud
      - name: the pinned ETHICS, GoEmotions, MATH and MMLU files (seal 10), each checked by its hash
        run: |
          mkdir -p /tmp/ethics /tmp/goemotions /tmp/math /tmp/mmlu
          curl -sSL -o /tmp/ethics/ethics.tar https://people.eecs.berkeley.edu/~hendrycks/ethics.tar
          echo "40acbf1ac0da79a2aabef394d58889136b8d38b05be09482006de2453fb06333  /tmp/ethics/ethics.tar" | sha256sum -c -
          tar -xf /tmp/ethics/ethics.tar -C /tmp/ethics ethics/commonsense
          for f in train.tsv dev.tsv test.tsv emotions.txt; do curl -sSL -o /tmp/goemotions/$f https://raw.githubusercontent.com/google-research/google-research/7951440944924ac61b6e2f9a2a3c715834005c40/goemotions/data/$f; done
          curl -sSL -o /tmp/math/train.parquet https://huggingface.co/datasets/qwedsacf/competition_math/resolve/e839825f9ec5c6cfa585c654a59610969ec13993/data/train-00000-of-00001-7320a6f3aba8ebd2.parquet
          echo "2325458edc03d786939ee9e1e5795efb9e2480247b6e1ed2c51f41bea7369c6a  /tmp/math/train.parquet" | sha256sum -c -
          python -I tools/math_derive.py /tmp/math/train.parquet /tmp/math/math.jsonl
          curl -sSL -o /tmp/mmlu/data.tar https://people.eecs.berkeley.edu/~hendrycks/data.tar
          echo "bec563ba4bac1d6aaf04141cd7d1605d7a5ca833e38f994051e818489592989b  /tmp/mmlu/data.tar" | sha256sum -c -
          tar -xf /tmp/mmlu/data.tar -C /tmp/mmlu data/dev data/val data/test
      - name: every committed night of every library re-derives byte for byte from the public data (X3, F3, T3, L3, M3, G3), with R0 re-run and the void nights replayed under their old order (seal 4)
        run: node tools/rederive.mjs /tmp/cuad/CUADv1.json --cord /tmp/cord/cord-v2-ground-truth.jsonl --polyai /tmp/polyai --clinc /tmp/clinc150 --maud /tmp/maud --ethics /tmp/ethics --emotions /tmp/goemotions --maths /tmp/math --subjects /tmp/mmlu
      - name: the catalogue (seal 5) - K1 exact, K2 patterns asked, K3 addresses, K4 shadows, K5 conflicts all re-derive from the pinned Banking77 (timings are not compared)
        run: node tools/catalogue-measure.mjs /tmp/polyai --runs 1 --check
      # Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness - every mutant of every kernel must die, and the committed counts must re-derive
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          for n in extract cycle build night oauth value finance triage catalogue csv router clinc maud; do
            node /tmp/witness/witness.mjs mutate "src/$n.mjs" --timeout 60000 --cap 2000 --test node --test "test/$n.test.mjs" > "/tmp/w-$n.json" || true
            node tools/witness-check.mjs "$n" "/tmp/w-$n.json"
          done
