name: proof
on: [push, pull_request, workflow_dispatch]
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: the kernels, the wire end to end, the source scans, the vendored law, the value, the page
        run: npm test
      - name: no key- or token-shaped string in any tracked file (W3)
        run: node tools/scan.mjs
      - name: the pinned CUAD file, checked by hash
        run: |
          mkdir -p /tmp/cuad
          curl -sSL -o /tmp/cuad/data.zip https://github.com/TheAtticusProject/cuad/raw/main/data.zip
          echo "f8161d18bea4e9c05e78fa6dda61c19c846fb8087ea969c172753bc2f45b999a  /tmp/cuad/data.zip" | sha256sum -c -
          unzip -q -o /tmp/cuad/data.zip CUADv1.json -d /tmp/cuad
      - name: every committed night re-derives byte for byte from the public contracts (X3)
        run: node tools/rederive.mjs /tmp/cuad/CUADv1.json
      # Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness - every mutant of every kernel must die, and the committed counts must re-derive
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          for n in extract cycle build night oauth value; do
            node /tmp/witness/witness.mjs mutate "src/$n.mjs" --timeout 60000 --cap 2000 --test node --test "test/$n.test.mjs" > "/tmp/w-$n.json" || true
            node tools/witness-check.mjs "$n" "/tmp/w-$n.json"
          done
